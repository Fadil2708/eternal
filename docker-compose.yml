name: eternal

services:
  app:
    build: .
    container_name: eternal-app
    ports:
      - "8082:8080"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eternal_db
      DB_USERNAME: eternal
      DB_PASSWORD: Eternal@2026
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eternal-network
      - proxy

  redis:
    image: redis:7-alpine
    container_name: eternal-redis
    volumes:
      - eternal-redis-data:/data
    networks:
      - eternal-network

  mysql:
    image: mysql:8.0
    container_name: eternal-mysql
    environment:
      MYSQL_DATABASE: eternal_db
      MYSQL_ROOT_PASSWORD: rootpassword2026
      MYSQL_USER: eternal
      MYSQL_PASSWORD: Eternal@2026
    volumes:
      - eternal-mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - eternal-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: eternal-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: eternal
      PMA_PASSWORD: Eternal@2026
    ports:
      - "8083:80"
    depends_on:
      - mysql
    networks:
      - eternal-network

volumes:
  eternal-mysql-data:
    name: eternal_eternal-mysql-data
  eternal-redis-data:
    name: eternal_eternal-redis-data

networks:
  eternal-network:
    driver: bridge
  proxy:
    external: true