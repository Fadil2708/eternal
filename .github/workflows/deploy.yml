name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fadil2708/eternal

jobs:
  ci:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, gd, exif, iconv, intl, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Laravel Pint (code style)
        run: php vendor/bin/pint --test
        continue-on-error: true

      - name: Run PHPUnit tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        continue-on-error: true

  build-image:
    name: Build Docker Image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=production
            APP_DEBUG=false

      - name: Save image info
        run: |
          echo "### Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Server
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "========================================="
            echo "  DEPLOY STARTED at $(date)"
            echo "========================================="

            cd /opt/docker/eternal

            echo "--- 1/8 Login to GHCR ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo "--- 2/8 Pull latest code ---"
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo chown -R $(whoami):$(whoami) /opt/docker/eternal

            echo "--- 3/8 Load .env ---"
            set -a
            source .env
            set +a

            echo "--- 4/8 Running backup ---"
            bash deploy/backup.sh || echo "Backup failed, continuing..."

            echo "--- 5/8 Pull new Docker image & restart ---"
            docker compose pull app
            docker compose stop app queue 2>/dev/null || true
            docker compose rm -f app queue 2>/dev/null || true
            docker compose up -d app queue

            echo "--- Waiting for containers to be ready ---"
            sleep 15

            echo "--- 6/8 Running migrations ---"
            docker compose exec -T app php artisan migrate --force

            echo "--- 7/8 Post-deploy setup ---"
            docker compose exec -T app php artisan livewire:publish --assets
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache

            echo "--- 8/8 Health check ---"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082 || echo "000")
            echo "App HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "302" ]; then
              echo "========================================="
              echo "  DEPLOY SUCCESS!"
              echo "  Time: $(date)"
              echo "========================================="
            else
              echo "========================================="
              echo "  DEPLOY FAILED: HTTP ${HTTP_STATUS}"
              echo "  Attempting rollback..."
              echo "========================================="

              docker compose down app queue
              docker compose up -d app queue
              sleep 10
              ROLLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082 || echo "000")
              echo "Rollback HTTP status: ${ROLLBACK_STATUS}"
              exit 1
            fi

  notify:
    name: Discord Notification
    needs: [build-image, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Discord notification
        if: always()
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          if [ "$DEPLOY_RESULT" = "success" ]; then
            COLOR=3066993
            EMOJI=":white_check_mark:"
            TITLE="Deploy SUCCESS"
          else
            COLOR=15158332
            EMOJI=":x:"
            TITLE="Deploy FAILED"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${EMOJI} ${TITLE}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"${{ github.repository }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Image\", \"value\": \"\\\`ghcr.io/${{ github.repository }}:${{ needs.build-image.outputs.image_tag }}\\\`\", \"inline\": false},
                  {\"name\": \"Run\", \"value\": \"[View Details](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"GitHub Actions\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
